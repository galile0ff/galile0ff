<svg xmlns="http://www.w3.org/2000/svg" width="830" height="250" viewBox="0 0 830 250" role="img" aria-label="galile0ff terminal banner">
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; font-size: 15px; fill: #c9d1d9; }
    .g { fill: #00ff41; }
    .d { fill: #8b949e; }
    .out { opacity: 0; animation: show .01s forwards; }
    @keyframes show { to { opacity: 1; } }
    .t1 { width: 0; animation: type1 .6s steps(8) .3s forwards; }
    .t2 { width: 0; animation: type2 1s steps(15) 1.7s forwards; }
    @keyframes type1 { to { width: 90px; } }
    @keyframes type2 { to { width: 150px; } }
    .cur { opacity: 0; animation: blink 1s steps(1) 3.4s infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0; } }
    .glow { filter: drop-shadow(0 0 4px #00ff41); }
  </style>
  <defs>
    <clipPath id="c1"><rect class="t1" x="28" y="72" height="26"/></clipPath>
    <clipPath id="c2"><rect class="t2" x="28" y="136" height="26"/></clipPath>
  </defs>

  <rect x="0.5" y="0.5" width="829" height="249" rx="10" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 38 V10.5 a10 10 0 0 1 10 -10 H819.5 a10 10 0 0 1 10 10 V38 z" fill="#161b22"/>
  <circle cx="24" cy="20" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="20" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="20" r="6" fill="#27c93f"/>
  <text x="415" y="25" text-anchor="middle" class="d" style="font-size:13px">root@galile0ff: ~</text>

  <g clip-path="url(#c1)"><text x="28" y="92"><tspan class="g">$</tspan> whoami</text></g>
  <text class="out g glow" x="28" y="120" style="animation-delay:1.1s;font-size:20px;font-weight:700">galile0ff  //  Yağız</text>

  <g clip-path="url(#c2)"><text x="28" y="156"><tspan class="g">$</tspan> cat focus.txt</text></g>
  <text class="out" x="28" y="184" style="animation-delay:2.9s">makine mühendisliği · yazılım · siber güvenlik</text>

  <text class="out" x="28" y="220" style="animation-delay:3.3s"><tspan class="g">$</tspan></text>
  <rect class="cur" x="44" y="207" width="9" height="16" fill="#00ff41"/>
</svg>
