    <text class="c" x="67" y="90">keşif, OSINT</text>
  </g>
  <path class="a s" style="animation-delay:.2s" d="M131 41 H142 M138 37 L142 41 L138 45"/>

  <g class="s" style="animation-delay:.3s">
    <rect class="b" x="144" y="14" width="124" height="54" rx="6" stroke="#ff7a3b"/>
    <text class="n" x="206" y="33">02</text><text class="l" x="206" y="55" fill="#ff7a3b">ENUM</text>
    <text class="c" x="206" y="90">servis, zafiyet</text>
  </g>
  <path class="a s" style="animation-delay:.4s" d="M270 41 H281 M277 37 L281 41 L277 45"/>

  <g class="s" style="animation-delay:.5s">
