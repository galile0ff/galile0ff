    <text class="c" x="345" y="90">erişim kazan</text>
  </g>
  <path class="a s" style="animation-delay:.6s" d="M409 41 H420 M416 37 L420 41 L416 45"/>

  <g class="s" style="animation-delay:.7s">
    <rect class="b" x="422" y="14" width="124" height="54" rx="6" stroke="#a3d635"/>
    <text class="n" x="484" y="33">04</text><text class="l" x="484" y="55" fill="#a3d635">PRIV-ESC</text>
    <text class="c" x="484" y="90">yetki yükselt</text>
  </g>
  <path class="a s" style="animation-delay:.8s" d="M548 41 H559 M555 37 L559 41 L555 45"/>

  <g class="s" style="animation-delay:.9s">
