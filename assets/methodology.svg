<svg xmlns="http://www.w3.org/2000/svg" width="830" height="130" viewBox="0 0 830 130" role="img" aria-label="Metodoloji: recon, enum, exploit, priv-esc, persist, report" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    text { font-family: 'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace; text-anchor: middle; }
    .n { font-size: 11px; fill: #8b949e; }
    .l { font-size: 14px; font-weight: 700; }
    .c { font-size: 10.5px; fill: #8b949e; }
    .b { fill: #0d1117; stroke-width: 1.5; }
    .a { stroke: #30363d; stroke-width: 1.5; fill: none; }
    .s { opacity: 0; animation: show .4s forwards; }
    @keyframes show { to { opacity: 1; } }
  </style>

  <g class="s" style="animation-delay:.1s">
    <rect class="b" x="5" y="14" width="124" height="54" rx="6" stroke="#ff3b3b"/>
